<!DOCTYPE html>
<!--
  Form di prova per Auto Form Filler.
  Aprilo in locale:
    python form_filler.py --url "file:///PERCORSO/test_form.html" --no-submit
-->
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Iscrizione di prova</title>
</head>
<body>
  <h1>Modulo di iscrizione (test)</h1>
  <form>
    <p><label for="nome">Nome</label>
       <input type="text" id="nome" name="nome"></p>

    <p><label for="cognome">Cognome</label>
       <input type="text" id="cognome" name="cognome"></p>

    <p><label for="email">Indirizzo email</label>
       <input type="email" id="email" name="email" required></p>

    <p><label for="tel">Numero di telefono</label>
       <input type="tel" id="tel" name="telefono" placeholder="+39 ..."></p>

    <p><label for="citta">Città di residenza</label>
       <input type="text" id="citta" name="citta"></p>

    <p><label for="paese">Paese</label>
       <select id="paese" name="paese">
         <option value="">— seleziona —</option>
         <option value="it">Italia</option>
         <option value="fr">Francia</option>
         <option value="de">Germania</option>
       </select></p>

    <p>
      <input type="checkbox" id="newsletter" name="newsletter">
      <label for="newsletter">Iscrivimi alla newsletter</label>
    </p>

    <p><label for="doc">Carica documento d'identità</label>
       <input type="file" id="doc" name="documento"></p>

    <p><button type="submit">Invia iscrizione</button></p>
  </form>
</body>
</html>
